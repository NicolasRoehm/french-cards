name: APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build web + sync Android
        run: |
          npm ci
          npm run sync

      - name: Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: APK signé
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/french-cards.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: french-cards-apk
          path: ${{ runner.temp }}/french-cards.apk

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v4.0.${{ github.run_number }}"
          gh release create "$TAG" "$RUNNER_TEMP/french-cards.apk" \
            --title "French Cards $TAG" \
            --notes "APK signé, prêt à installer. Lien permanent : https://github.com/${{ github.repository }}/releases/latest/download/french-cards.apk" \
            --latest
