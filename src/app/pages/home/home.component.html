<app-page-layout>
  <div class="container my-3">

    <!-- NOTE Navigation -->
    <div class="mb-3" *ngIf="editMode">
      <app-nav-block></app-nav-block>
    </div>

    <!-- NOTE Placeholder -->
    <ng-container *ngIf="isLoading">
      <div class="card mb-3">
        <div class="card-header">
          <div class="mb-2 header-placeholder placeholder-glow" ><div class="placeholder"></div></div>
        </div>
        <div class="card-body">
          <div class="ratio ratio-16x9">
            <div class="body-placeholder placeholder-glow"><div class="placeholder"></div></div>
          </div>
        </div>
      </div>
    </ng-container>

    <!-- NOTE Cards -->
    <ng-container *ngFor="let card of cards">
      <app-card-block [card]="card" [editMode]="editMode"></app-card-block>
    </ng-container>

    <!-- NOTE Edit mode -->
    <div class="d-flex justify-content-center">
      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" role="switch" id="editmode" [(ngModel)]="editMode">
        <label class="form-check-label" for="editmode">{{ 'EDIT_MODE' | translate }}</label>
      </div>
    </div>

  </div>
</app-page-layout>
