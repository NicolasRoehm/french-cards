<app-page-layout>
  <app-back-btn></app-back-btn>

  <div class="scan-component-container">
    <div class="scan-component text-center">

      <svg-icon *ngIf="!isScanning" [src]="'assets/img/icons/barcode.svg'" [svgStyle]="{ 'fill': 'currentColor', 'width': '200px', 'margin-top': '-50px' }"></svg-icon>

      <div class="scan-block" *ngIf="isScanning"></div>

      <div class="text-center" *ngIf="hasPermission === false">
        {{ 'SCANNER_CAM_PERMISSION' | translate }}
      </div>

    </div>
  </div>

  <div class="position-fixed bottom-0 d-flex align-items-center justify-content-center w-100 mb-3">
    <button class="btn" [ngClass]="{ 'btn-secondary' : !hasPermission, 'btn-success' : !isScanning && hasPermission, 'btn-danger' : isScanning }" type="button" (click)="onClickToggleCamera()" [disabled]="!hasPermission">
      <ng-container *ngIf="!isScanning">{{ 'START_SCANNING' | translate }}</ng-container>
      <ng-container *ngIf="isScanning">{{ 'STOP_SCANNING' | translate }}</ng-container>
    </button>
  </div>

</app-page-layout>
